name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -v
      - run: python -m compileall -q content_chat tests
      - run: python -m pip install .
      - run: content-chat --help
      - run: python tools/evaluate_live.py --help
      - run: node --check content_chat/web/app.js
      - run: node --test tests/web-state.test.js
